<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>여행 후기 - Travel Compass</title>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {sans: ['Inter', '"Malgun Gothic"', 'sans-serif']},
                    colors: {
                        primary: {
                            50: '#eef2f8', 100: '#dbe4f1', 200: '#b7c9e3', 300: '#93aed5',
                            400: '#6f93c1', 500: '#5070ad', 600: '#435d8f', 700: '#364a72',
                            800: '#293755', 900: '#1c2438'
                        }
                    },
                    boxShadow: {
                        card: '0 2px 12px rgba(23, 34, 59, 0.06)',
                        'card-hover': '0 10px 30px rgba(23, 34, 59, 0.10)'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-primary-50 font-sans text-slate-800 antialiased">
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="mx-auto max-w-2xl px-4 py-8 sm:px-6 lg:px-8" th:data-country-code="${countryCode}" id="app-data">
    <div class="rounded-2xl bg-white p-6 shadow-card sm:p-8">
        <h2 class="text-xl font-bold text-slate-900">여행 후기</h2>
        <form class="mt-4 flex gap-3" id="search-form">
            <input type="text" id="search-country-code" placeholder="국가 코드 또는 국가명 입력 (예: KR, 대한민국, Korea)"
                   th:value="${countryCode}" required
                   class="w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm text-slate-800 shadow-sm outline-none transition focus:border-primary-400 focus:ring-2 focus:ring-primary-100">
            <button type="submit"
                    class="inline-flex shrink-0 items-center justify-center rounded-xl bg-primary-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-primary-700">후기 검색</button>
        </form>
        <ul id="search-results" class="mt-3 divide-y divide-slate-100 overflow-hidden rounded-xl border border-slate-100 empty:hidden empty:border-0"></ul>
    </div>

    <div class="mt-6 rounded-2xl bg-white p-6 shadow-card sm:p-8" id="write-card">
        <h3 class="text-base font-semibold text-slate-800">후기 작성</h3>
        <form class="mt-4 space-y-4" id="review-form">
            <div>
                <label for="rating" class="mb-1.5 block text-sm font-semibold text-slate-700">평점 (1~5)</label>
                <input type="number" id="rating" min="1" max="5" required
                       class="w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm text-slate-800 shadow-sm outline-none transition focus:border-primary-400 focus:ring-2 focus:ring-primary-100">
            </div>
            <div>
                <label for="content" class="mb-1.5 block text-sm font-semibold text-slate-700">내용</label>
                <textarea id="content" rows="3" required
                          class="w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm text-slate-800 shadow-sm outline-none transition focus:border-primary-400 focus:ring-2 focus:ring-primary-100"></textarea>
            </div>
            <button type="submit"
                    class="inline-flex items-center justify-center rounded-xl bg-emerald-500 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-emerald-600">등록</button>
        </form>
    </div>

    <div class="mt-6 rounded-2xl bg-white p-6 shadow-card sm:p-8">
        <ul class="space-y-2" id="review-list"></ul>
    </div>
</main>

<script th:src="@{/js/api.js}"></script>
<script th:src="@{/js/review-list.js}"></script>
</body>
</html>
