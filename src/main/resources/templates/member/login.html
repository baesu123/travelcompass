<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인 - Travel Compass</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="card" style="max-width: 400px; margin: 3rem auto;">
        <h2>로그인</h2>

        <p class="error-message" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다.</p>
        <p th:if="${param.signup}">회원가입이 완료되었습니다. 로그인해주세요.</p>
        <p th:if="${param.logout}">로그아웃되었습니다.</p>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">아이디</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">로그인</button>
        </form>

        <p>계정이 없으신가요? <a th:href="@{/signup}">회원가입</a></p>
    </div>
</div>
</body>
</html>
