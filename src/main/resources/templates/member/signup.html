<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입 - Travel Compass</title>
</head>
<body>
<h2>회원가입</h2>

<p th:if="${errorMessage}" th:text="${errorMessage}"></p>

<form th:action="@{/signup}" th:object="${signupForm}" method="post">
    <div>
        <label for="username">아이디</label>
        <input type="text" id="username" th:field="*{username}" required autofocus>
        <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
    </div>
    <div>
        <label for="password">비밀번호</label>
        <input type="password" id="password" th:field="*{password}" required>
        <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
    </div>
    <div>
        <label for="name">이름</label>
        <input type="text" id="name" th:field="*{name}" required>
        <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
    </div>
    <div>
        <label for="nickname">닉네임</label>
        <input type="text" id="nickname" th:field="*{nickname}" required>
        <p th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}"></p>
    </div>
    <button type="submit">가입하기</button>
</form>

<p>이미 계정이 있으신가요? <a th:href="@{/login}">로그인</a></p>
</body>
</html>
