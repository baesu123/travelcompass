<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - Travel Compass</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {sans: ['Inter', '"Malgun Gothic"', 'sans-serif']},
                    colors: {
                        primary: {
                            50: '#eef2f8', 100: '#dbe4f1', 200: '#b7c9e3', 300: '#93aed5',
                            400: '#6f93c1', 500: '#5070ad', 600: '#435d8f', 700: '#364a72',
                            800: '#293755', 900: '#1c2438'
                        }
                    },
                    boxShadow: {
                        card: '0 2px 12px rgba(23, 34, 59, 0.06)',
                        'card-hover': '0 10px 30px rgba(23, 34, 59, 0.10)'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="flex min-h-screen items-center justify-center bg-primary-50 px-4 py-10 font-sans text-slate-800 antialiased">
<div class="w-full max-w-sm">
    <div class="mb-6 flex items-center justify-center gap-2 text-xl font-bold text-primary-700">
        <span class="inline-flex h-9 w-9 items-center justify-center rounded-lg bg-primary-600 text-white">🧭</span>
        Travel Compass
    </div>

    <div class="rounded-2xl bg-white p-8 shadow-card">
        <h2 class="text-xl font-bold text-slate-900">회원가입</h2>

        <p class="mt-3 rounded-lg bg-rose-50 px-3 py-2 text-sm text-rose-600" th:if="${errorMessage}" th:text="${errorMessage}"></p>

        <form class="mt-6 space-y-4" th:action="@{/signup}" th:object="${signupForm}" method="post">
            <div>
                <label for="username" class="mb-1.5 block text-sm font-semibold text-slate-700">아이디</label>
                <input type="text" id="username" th:field="*{username}" required autofocus
                       class="w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm text-slate-800 shadow-sm outline-none transition focus:border-primary-400 focus:ring-2 focus:ring-primary-100">
                <p class="mt-1 text-xs text-rose-600" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
            </div>
            <div>
                <label for="password" class="mb-1.5 block text-sm font-semibold text-slate-700">비밀번호</label>
                <input type="password" id="password" th:field="*{password}" required
                       class="w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm text-slate-800 shadow-sm outline-none transition focus:border-primary-400 focus:ring-2 focus:ring-primary-100">
                <p class="mt-1 text-xs text-rose-600" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
            </div>
            <div>
                <label for="nickname" class="mb-1.5 block text-sm font-semibold text-slate-700">닉네임</label>
                <input type="text" id="nickname" th:field="*{nickname}" required
                       class="w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm text-slate-800 shadow-sm outline-none transition focus:border-primary-400 focus:ring-2 focus:ring-primary-100">
                <p class="mt-1 text-xs text-rose-600" th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}"></p>
            </div>
            <button type="submit"
                    class="w-full rounded-xl bg-primary-600 px-4 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-primary-700">가입하기</button>
        </form>

        <p class="mt-6 text-center text-sm text-slate-500">이미 계정이 있으신가요?
            <a th:href="@{/login}" class="font-semibold text-primary-700 hover:underline">로그인</a>
        </p>
    </div>
</div>
</body>
</html>
