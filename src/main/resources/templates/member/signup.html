<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입 - Travel Compass</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="card" style="max-width: 400px; margin: 3rem auto;">
        <h2>회원가입</h2>

        <p class="error-message" th:if="${errorMessage}" th:text="${errorMessage}"></p>

        <form th:action="@{/signup}" th:object="${signupForm}" method="post">
            <div class="form-group">
                <label for="username">아이디</label>
                <input type="text" id="username" th:field="*{username}" required autofocus>
                <p class="error-message" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
            </div>
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" th:field="*{password}" required>
                <p class="error-message" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
            </div>
            <div class="form-group">
                <label for="nickname">닉네임</label>
                <input type="text" id="nickname" th:field="*{nickname}" required>
                <p class="error-message" th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}"></p>
            </div>
            <button type="submit">가입하기</button>
        </form>

        <p>이미 계정이 있으신가요? <a th:href="@{/login}">로그인</a></p>
    </div>
</div>
</body>
</html>
