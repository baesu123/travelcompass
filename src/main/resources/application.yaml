spring:
  application:
    name: travelcompass
  profiles:
    active: local   # 기본 실행 프로필. 배포 시 --spring.profiles.active=prod 로 오버라이드
  thymeleaf:
    cache: false

  sql:
    init:
      mode: always  # 매번 실행 시 schema.sql / data.sql 자동 실행
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql


mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.travelcompass.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.example.travelcompass: debug

